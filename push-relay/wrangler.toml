# Cloudflare Worker that turns "I just created call X / notification Y" into an FCM push to the recipient.
# Free tier: 100,000 requests/day. Deploy: see push-relay/README.md
name = "ridealong-push"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
FIREBASE_PROJECT_ID = "ridealong-f946d"
# Secret (never commit): SERVICE_ACCOUNT_JSON = contents of the Firebase service-account key file